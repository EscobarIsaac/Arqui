<!DOCTYPE html>
<html>
<head>
    <title>Login - Monsters Inc</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>

<body>

<div class="form-container">
    <div class="card">

        <img src="{{ url_for('static', filename='sullivan.gif') }}" class="sullivan-gif">

        <h2>Iniciar Sesión</h2>

        <form method="POST">
            <input type="text" name="usuario" placeholder="Usuario" class="form-control" required>
            <input type="password" name="contraseña" placeholder="Contraseña" class="form-control" required>

            <button type="submit" class="btn btn-custom">
                Ingresar
            </button>
        </form>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-danger">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <div class="footer">Bienvenidos a  Monsters Inc</div>

    </div>
</div>

</body>
</html>
