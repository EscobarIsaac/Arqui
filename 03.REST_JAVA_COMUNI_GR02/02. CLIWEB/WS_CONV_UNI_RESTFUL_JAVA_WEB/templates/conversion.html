<!DOCTYPE html>
<html>
<head>
    <title>Conversión de Unidades - Monsters Inc</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>

<body>

<div class="card">

    <img src="{{ url_for('static', filename='sullivan.gif') }}" class="sullivan-gif">

    <h2>Conversión de Unidades</h2>

    <form method="POST">

        <input type="number" name="valor" placeholder="Ingrese valor" class="form-control" required>

        <select name="origen" class="form-control">
            <option>m</option>
            <option>cm</option>
            <option>km</option>
            <option>in</option>
            <option>ft</option>
            <option>kg</option>
            <option>g</option>
            <option>lb</option>
            <option>oz</option>
            <option>t</option>
            <option>C</option>
            <option>F</option>
            <option>K</option>
            <option>R</option>
        </select>

        <select name="destino" class="form-control">
            <option>m</option>
            <option>cm</option>
            <option>km</option>
            <option>in</option>
            <option>ft</option>
            <option>kg</option>
            <option>g</option>
            <option>lb</option>
            <option>oz</option>
            <option>t</option>
            <option>C</option>
            <option>F</option>
            <option>K</option>
            <option>R</option>
        </select>

        <button type="submit" class="btn btn-custom">
            Convertir
        </button>

    </form>

    {% if resultado %}
    <div class="alert alert-success">
        {{ resultado }}
    </div>
    {% endif %}

    <a href="{{ url_for('logout') }}" class="btn btn-danger">
        Cerrar Sesión
    </a>

    <div class="footer">Desarrollado con ❤️ para Monsters Inc</div>

</div>

</body>
</html>
